openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inquiries
    description: Public website inquiry operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: emailReadiness
      tags: [health]
      summary: Check mail configuration
      description: Checks configuration presence and syntax only, not SMTP authentication or delivery.
      responses:
        "200":
          description: Mail settings configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailReadiness"
        "503":
          description: Mail settings missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailReadiness"
  /inquiries/demo:
    post:
      operationId: submitDemoRequest
      tags: [inquiries]
      summary: Submit a demo request
      description: Sends a plain-text email via SMTP2GO. No database storage. Success means SMTP acceptance, not guaranteed inbox delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRequestInput"
      responses:
        "201":
          description: Demo request accepted for email delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryReceipt"
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/OriginDenied"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/JsonRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/MailFailed"
        "503":
          $ref: "#/components/responses/MailUnavailable"
  /inquiries/access:
    post:
      operationId: submitAccessRequest
      tags: [inquiries]
      summary: Submit a company access request
      description: Emails an access request. No login, account or invitation is created and no database record is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestInput"
      responses:
        "201":
          description: Access request accepted for email delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryReceipt"
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/OriginDenied"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/JsonRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/MailFailed"
        "503":
          $ref: "#/components/responses/MailUnavailable"
  /inquiries/contact:
    post:
      operationId: submitContactRequest
      tags: [inquiries]
      summary: Submit a general contact request
      description: Emails a contact message without database storage. Success means SMTP acceptance, not guaranteed inbox delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequestInput"
      responses:
        "201":
          description: Contact message accepted for email delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryReceipt"
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/OriginDenied"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/JsonRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/MailFailed"
        "503":
          $ref: "#/components/responses/MailUnavailable"
  /hero-events:
    post:
      operationId: trackHeroEvent
      tags: [inquiries]
      summary: Record an anonymous homepage video or trial CTA event
      description: Writes one allowlisted event to structured server logs. No database, cookies, visitor identifiers, or free-form properties. Counts are indicative and not unique visitors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeroEventInput"
      responses:
        "204":
          description: Event recorded
        "400":
          description: Invalid event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          $ref: "#/components/responses/OriginDenied"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/JsonRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
  /marketing-events:
    post:
      operationId: trackMarketingEvent
      tags: [inquiries]
      summary: Disabled marketing event endpoint
      deprecated: true
      description: Tracking is retired. This endpoint never stores an event or sends email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingEventInput"
      responses:
        "410":
          description: Marketing event tracking is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  responses:
    OriginDenied:
      description: Website origin not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    TooLarge:
      description: Submission exceeds the 16KB body limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    JsonRequired:
      description: JSON content type required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    RateLimited:
      description: Submission limit reached; retry after the delay
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until retry is permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    MailFailed:
      description: SMTP acceptance could not be confirmed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    MailUnavailable:
      description: Mail configuration missing or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    EmailReadiness:
      type: object
      required: [emailConfigured]
      properties:
        emailConfigured: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BusinessType:
      type: string
      enum:
        - contractor
        - permit_expeditor
    DemoRequestInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        workEmail:
          type: string
          format: email
        companyName:
          type: string
          minLength: 2
          maxLength: 160
        businessType:
          $ref: "#/components/schemas/BusinessType"
        challenge:
          type: string
          maxLength: 2000
      required:
        - fullName
        - workEmail
        - companyName
        - businessType
    AccessRequestInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        workEmail:
          type: string
          format: email
        companyName:
          type: string
          minLength: 2
          maxLength: 160
        businessType:
          $ref: "#/components/schemas/BusinessType"
        phone:
          type: string
          maxLength: 40
        monthlyPermitVolume:
          type: string
          enum:
            - 1-10
            - 11-25
            - 26-50
            - 51-100
            - 100+
            - not_sure
      required:
        - fullName
        - workEmail
        - companyName
        - businessType
        - monthlyPermitVolume
    ContactRequestInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        workEmail:
          type: string
          format: email
        companyName:
          type: string
          maxLength: 160
        message:
          type: string
          minLength: 10
          maxLength: 3000
      required:
        - fullName
        - workEmail
        - message
    InquiryReceipt:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum:
            - received
        message:
          type: string
      required:
        - id
        - status
        - message
    HeroEventInput:
      type: object
      additionalProperties: false
      properties:
        eventName:
          type: string
          enum:
            - hero_video_start
            - hero_video_half
            - hero_video_complete
            - hero_trial_click
      required:
        - eventName
    MarketingEventInput:
      type: object
      properties:
        eventName:
          type: string
          enum:
            - cta_get_started
            - cta_request_demo
            - cta_sign_in
            - signup_submitted
            - demo_submitted
            - contact_submitted
        path:
          type: string
          maxLength: 200
      required:
        - eventName
        - path

